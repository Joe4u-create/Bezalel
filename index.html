<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumière Interiors</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="description" content="Lumière Interiors — award-winning interior design studio for homes, offices and hospitality spaces.">
<meta name="theme-color" content="#06060f">
<meta property="og:title" content="Lumière Interiors">
<meta property="og:description" content="Award-winning interiors that blend future-forward technology with timeless craft.">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Space+Grotesk:wght@300..700&display=swap">
<style>
:root{--primary:#8b5cff;--accent:#22e5c8;--accent2:#ffb86b;--bg:#06060f;--text:#eef0ff;--muted:#9aa0c0;--fh:'Syne',sans-serif;--fb:'Space Grotesk',sans-serif;--spd:1;--logoh:40px;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--glowc:rgba(139,92,255,.4);--rad-ui:22px;--br:999px;--blur:18px;--maxw:1240px;--hh:100vh}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);overflow-x:hidden;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.1}
.muted{color:var(--muted)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(16px,4vw,40px)}
section{position:relative;padding:clamp(70px,11vw,140px) 0;scroll-margin-top:64px}
#bg{position:fixed;inset:0;z-index:-3;width:100%;height:100%}
#bgcss,#bgimg{position:fixed;inset:0;z-index:-2;pointer-events:none}
#bgimg{background-size:cover;background-position:center}
.grain{display:none;position:fixed;inset:-50%;z-index:60;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
body.grainon .grain{display:block}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}100%{transform:translate(3%,3%)}}
#prog{position:fixed;top:0;left:0;height:3px;width:0;z-index:200;background:linear-gradient(90deg,var(--primary),var(--accent),var(--accent2));box-shadow:0 0 12px var(--glowc)}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;pointer-events:none;z-index:-1;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--glowc),transparent 65%);opacity:0;transition:opacity .4s;left:50%;top:50%}
body.cursoron #glow{opacity:.7}
@media(hover:none){#glow{display:none}}
/* loader */
#loader{position:fixed;inset:0;z-index:1000;background:var(--bg);display:grid;place-items:center;transition:transform .9s cubic-bezier(.77,0,.18,1),opacity .8s}
#loader.out.curtain{transform:translateY(-100%)}
#loader.out.fade{opacity:0}
#loader.out.zoom{opacity:0;transform:scale(1.4)}
#loader.gone{display:none}
.ld{text-align:center}
.ld .lg{height:calc(var(--logoh)*1.8);margin:0 auto 18px;display:flex;justify-content:center;animation:pulse 1.6s ease-in-out infinite}
.ld .lg img,.ld .lg svg{height:100%;width:auto}
.ld h2{font-size:clamp(26px,5vw,44px);letter-spacing:.04em}
.ld .bar{width:min(260px,70vw);height:3px;background:var(--line);margin:22px auto 8px;border-radius:9px;overflow:hidden}
.ld .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));box-shadow:0 0 14px var(--glowc)}
@keyframes pulse{50%{transform:scale(1.08);filter:drop-shadow(0 0 18px var(--glowc))}}
/* announcement */
#annc{display:none;background:linear-gradient(90deg,var(--primary),var(--accent));color:#06060f;font-weight:600;text-align:center;padding:7px 14px;font-size:14px;position:relative;z-index:55}
/* nav */
#nav{position:sticky;top:0;z-index:80;transition:.35s;padding:14px 0}
#nav.sc{background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(var(--blur));border-bottom:1px solid var(--line);padding:8px 0}
.nv{display:flex;align-items:center;gap:18px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fh);font-weight:700;font-size:22px;white-space:nowrap}
.brand .lg{height:var(--logoh);display:flex;align-items:center}
.brand .lg img,.brand .lg svg{height:100%;width:auto}
.links{display:flex;gap:6px;align-items:center}
.links a.l{padding:8px 14px;border-radius:99px;color:var(--muted);font-size:15px;transition:.3s;position:relative}
.links a.l:hover{color:var(--text);background:var(--glass)}
.nact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
#burger{display:none;width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--line);place-items:center}
#burger i,#burger i:before,#burger i:after{display:block;width:18px;height:2px;background:var(--text);position:relative;transition:.3s;content:''}
#burger i:before{position:absolute;top:-6px}#burger i:after{position:absolute;top:6px}
#nav.open #burger i{background:transparent}#nav.open #burger i:before{top:0;transform:rotate(45deg)}#nav.open #burger i:after{top:0;transform:rotate(-45deg)}
@media(max-width:980px){#burger{display:grid}.links,.nact{display:none}#nav.open .nv{flex-wrap:wrap}#nav.open .links,#nav.open .nact{display:flex;width:100%;flex-direction:column;align-items:stretch;order:3}#nav.open .links a.l{padding:12px}#nav.open{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);max-height:100vh;overflow:auto}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:var(--br);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);transition:transform .25s,box-shadow .3s,background .3s;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{box-shadow:0 0 28px var(--glowc);border-color:var(--primary)}
.btn.pri{background:linear-gradient(120deg,var(--primary),var(--accent));color:#06060f;border-color:transparent;background-size:200% 100%;animation:gshift 5s linear infinite}
.btn.pri:hover{box-shadow:0 8px 40px var(--glowc)}
.btn.sm{padding:8px 16px;font-size:14px}
.btn:after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover:after{left:140%}
.btn[disabled]{opacity:.45;pointer-events:none}
.hide{display:none!important}
/* hero */
.hero{min-height:var(--hh);display:flex;align-items:center;padding:clamp(40px,6vw,80px) 0;overflow:hidden}
#banner{position:absolute;inset:0;z-index:-1;overflow:hidden}
#banner>div{position:absolute;inset:0}
.bn-grad{background:radial-gradient(60% 60% at 20% 20%,color-mix(in srgb,var(--primary) 45%,transparent),transparent),radial-gradient(50% 50% at 85% 30%,color-mix(in srgb,var(--accent) 35%,transparent),transparent),radial-gradient(60% 60% at 60% 95%,color-mix(in srgb,var(--accent2) 30%,transparent),transparent);background-size:200% 200%;animation:meshm 16s ease-in-out infinite alternate}
@keyframes meshm{to{background-position:100% 80%;filter:hue-rotate(25deg)}}
.bn-img,.bn-svg{background-size:cover;background-position:center}
.bn-img.kb{animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.15) translate(-2%,-2%)}}
.bn-over{background:linear-gradient(180deg,transparent 30%,var(--bg))}
.hero-in{display:grid;grid-template-columns:1.05fr .95fr;gap:30px;align-items:center;position:relative}
@media(max-width:900px){.hero-in{grid-template-columns:1fr;text-align:center}.hero-in .ctas{justify-content:center}}
.pill{display:inline-flex;gap:8px;align-items:center;padding:7px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);backdrop-filter:blur(8px)}
.pill:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse2 1.6s infinite}
@keyframes pulse2{50%{opacity:.3;transform:scale(1.6)}}
.hero h1{font-size:clamp(38px,6.4vw,84px);font-weight:800;margin:22px 0 20px;letter-spacing:-.02em}
.grad{background:linear-gradient(90deg,var(--primary),var(--accent),var(--accent2),var(--primary));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:gshift 6s linear infinite;display:inline-block}
.grad.nograd{background:none;animation:none}
@keyframes gshift{to{background-position:300% 0}}
.hero p.sub{font-size:clamp(16px,1.6vw,20px);color:var(--muted);max-width:560px}
@media(max-width:900px){.hero p.sub{margin:0 auto}}
.ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding-bottom:.08em}
.w i{display:inline-block;font-style:normal;transform:translateY(110%);animation:wup .9s calc(var(--i)*.07s + .2s) cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wup{to{transform:none}}
.blob{position:absolute;border-radius:60% 40% 55% 45%;filter:blur(40px);opacity:.35;animation:morph 14s ease-in-out infinite alternate;pointer-events:none;display:none}
body.shapes .blob{display:block}
.b1{width:300px;height:300px;background:var(--primary);top:-60px;left:-80px}
.b2{width:260px;height:260px;background:var(--accent);bottom:-40px;right:5%;animation-delay:-5s}
@keyframes morph{50%{border-radius:40% 60% 35% 65%;transform:translate(40px,30px) rotate(60deg)}100%{border-radius:65% 35% 60% 40%;transform:translate(-30px,50px) rotate(-30deg)}}
.scene{perspective:1500px;height:min(470px,70vw);display:grid;place-items:center}
.tiltw{transform:rotateX(-10deg);transform-style:preserve-3d}
.ring{position:relative;width:180px;height:250px;transform-style:preserve-3d;animation:spin calc(34s/var(--spd)) linear infinite}
.scene:hover .ring{animation-play-state:paused}
body:not(.ring3d) .scene{display:none}
.ring .it{position:absolute;inset:0;border-radius:20px;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:0 20px 50px #0009,0 0 40px var(--glowc);transform:rotateY(calc(var(--i)*(360deg/var(--n))))translateZ(var(--rd));cursor:pointer;backface-visibility:visible}
@keyframes spin{to{transform:rotateY(360deg)}}
@media(max-width:600px){.scene{transform:scale(.72)}}
.scroll{position:absolute;bottom:24px;left:50%;width:26px;height:42px;border:2px solid var(--line);border-radius:20px;transform:translateX(-50%)}
.scroll:after{content:'';position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:3px;background:var(--accent);animation:sc 1.6s infinite}
@keyframes sc{60%{transform:translateY(14px);opacity:0}}
/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--line);background:var(--glass);padding:16px 0;backdrop-filter:blur(8px)}
.marq div{display:flex;gap:46px;width:max-content;animation:mq calc(30s/var(--spd)) linear infinite;font-family:var(--fh);font-size:clamp(18px,2.4vw,28px);text-transform:uppercase;letter-spacing:.12em}
.marq span:nth-child(even){color:var(--accent)}
.marq span:after{content:'✦';margin-left:46px;color:var(--primary)}
@keyframes mq{to{transform:translateX(-50%)}}
/* headings */
.tag{display:inline-block;color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:13px;margin-bottom:14px}
.h2{font-size:clamp(30px,4.6vw,58px);font-weight:700;margin-bottom:16px;letter-spacing:-.015em}
.lead{color:var(--muted);max-width:640px;font-size:clamp(16px,1.5vw,19px)}
.sechead{margin-bottom:clamp(30px,5vw,60px)}
/* reveal */
body .rv{transition:opacity calc(.9s/var(--spd)) cubic-bezier(.2,.7,.2,1),transform calc(.9s/var(--spd)) cubic-bezier(.2,.7,.2,1),filter calc(.9s/var(--spd)),border-color .3s,box-shadow .4s}
body .rv.done{transition:transform .18s ease-out,border-color .3s,box-shadow .4s}
body[data-rv=fade] .rv:not(.in){opacity:0}
body[data-rv=up] .rv:not(.in){opacity:0;transform:translateY(50px)}
body[data-rv=zoom] .rv:not(.in){opacity:0;transform:scale(.85)}
body[data-rv=left] .rv:not(.in){opacity:0;transform:translateX(-60px)}
body[data-rv=blur] .rv:not(.in){opacity:0;filter:blur(16px);transform:translateY(20px)}
body[data-rv=flip] .rv:not(.in){opacity:0;transform:perspective(800px) rotateX(35deg) translateY(40px)}
/* cards */
.card,.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--rad-ui);backdrop-filter:blur(var(--blur));transition:border-color .3s,box-shadow .4s}
.card:hover{border-color:var(--primary);box-shadow:0 0 50px var(--glowc)}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,70px);align-items:center}
@media(max-width:860px){.about{grid-template-columns:1fr}}
.aimg{position:relative;aspect-ratio:4/5;border-radius:var(--rad-ui);overflow:hidden;border:1px solid var(--line);box-shadow:0 0 80px var(--glowc)}
.aimg img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s}
.aimg:hover img{transform:scale(1.07)}
.aimg:before{content:'';position:absolute;inset:-2px;z-index:1;border-radius:inherit;background:conic-gradient(from 0deg,transparent,var(--accent),transparent 40%);animation:rot 6s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:2px}
@keyframes rot{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-top:30px}
.stat{padding:18px;text-align:center}
.stat b{display:block;font-family:var(--fh);font-size:clamp(28px,3.4vw,42px);background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.svc{padding:30px;cursor:pointer;transform-style:preserve-3d;will-change:transform}
.svc .ic{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;margin-bottom:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 35%,transparent),color-mix(in srgb,var(--accent) 25%,transparent));color:var(--accent);transition:.5s}
.svc:hover .ic{transform:rotate(-8deg) scale(1.1);color:#fff;box-shadow:0 0 30px var(--glowc)}
.svc .ic svg{width:30px;height:30px}
.svc h3{font-size:22px;margin-bottom:10px}
.svc p{color:var(--muted);font-size:15px}
/* portfolio */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.chip{padding:8px 18px;border-radius:99px;border:1px solid var(--line);background:var(--glass);font-size:14px;transition:.3s}
.chip.on,.chip:hover{background:linear-gradient(120deg,var(--primary),var(--accent));color:#06060f;border-color:transparent}
.masonry{columns:3 290px;column-gap:20px}
.pj{break-inside:avoid;margin-bottom:20px;position:relative;border-radius:var(--rad-ui);overflow:hidden;cursor:zoom-in;border:1px solid var(--line);display:block}
.pj img{width:100%;transition:transform .9s cubic-bezier(.2,.7,.2,1),filter .5s}
.pj:hover img{transform:scale(1.1);filter:brightness(.55)}
.pj .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.85));opacity:.0;transform:translateY(20px);transition:.5s}
.pj:hover .ov{opacity:1;transform:none}
.pj h4{font-size:22px}.pj small{color:var(--accent);letter-spacing:.15em;text-transform:uppercase}
.pj .cnt{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);padding:5px 12px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
/* process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;counter-reset:s}
.step{padding:28px;position:relative;overflow:hidden}
.step:before{counter-increment:s;content:'0' counter(s);position:absolute;right:16px;top:4px;font-family:var(--fh);font-size:84px;font-weight:800;color:var(--glass);-webkit-text-stroke:1px var(--line)}
.step h4{font-size:20px;margin-bottom:8px;position:relative}.step p{color:var(--muted);font-size:15px;position:relative}
/* contact */
.cgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:26px}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
.cinfo{display:grid;gap:14px;align-content:start}
.ci{padding:20px;display:flex;gap:16px;align-items:center}
.ci i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--accent);flex:none}
.ci small{color:var(--muted);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
form.cf{padding:clamp(20px,3vw,36px);display:grid;grid-template-columns:1fr 1fr;gap:16px}
form.cf .full{grid-column:1/-1}
@media(max-width:560px){form.cf{grid-template-columns:1fr}}
.fld{position:relative}
.fld input,.fld select,.fld textarea{width:100%;padding:20px 16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:none;transition:.3s;color:var(--text)}
.fld select option{color:#111}
.fld textarea{resize:vertical;min-height:110px}
.fld label{position:absolute;left:16px;top:15px;color:var(--muted);transition:.25s;pointer-events:none;font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label,.fld input[type=date]+label,.fld select+label{top:5px;font-size:11px;color:var(--accent);letter-spacing:.08em}
.ok{display:none;text-align:center;padding:40px}
.ok svg{width:90px;height:90px;margin:0 auto 14px}
.ok circle,.ok path{stroke:var(--accent);fill:none;stroke-width:4;stroke-dasharray:300;stroke-dashoffset:300;animation:dr 1s forwards}
.ok path{animation-delay:.5s}
@keyframes dr{to{stroke-dashoffset:0}}
footer{border-top:1px solid var(--line);padding:40px 0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px)}
.ft{display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.ft .fl{display:flex;gap:10px;flex-wrap:wrap}
.pj:focus-visible,.chip:focus-visible,.btn:focus-visible,.svc:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ring,.marq div,.grain,.blob,.bn-img,.bn-grad{animation:none!important}}
/* overlays */
.ovl{position:fixed;inset:0;z-index:400;background:rgba(3,3,10,.72);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
.ovl.on{display:flex;animation:fi .35s}
@keyframes fi{from{opacity:0}}
.panel{width:min(460px,100%);padding:clamp(22px,4vw,34px);position:relative;background:color-mix(in srgb,var(--bg) 85%,#222);animation:pop .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.94)}}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}
.panel h3{font-size:26px;margin-bottom:6px}
.stack{display:grid;gap:14px;margin-top:18px}
.pw{position:relative}
.pw input{padding-right:48px!important}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.eye:hover{color:var(--accent)}
.eye svg{width:20px;height:20px}
.sel input,.sel select,.pwi{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);outline:none;color:var(--text)}
.sel select option{color:#111}
.sel input:focus,.sel select:focus,.pwi:focus{border-color:var(--accent)}
.msg{font-size:14px;min-height:20px;color:#ff7b8a}
.msg.g{color:var(--accent)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.who{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-family:var(--fh);font-size:24px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#06060f;font-weight:800}

  case'delsvc':if(confirm('Delete this service?')){CFG.content.services.splice(i,1);re()}return;
  case'addstat':CFG.content.stats.push({v:'100+',l:'New stat'});return re();
  case'delstat':CFG.content.stats.splice(i,1);return re();
  case'replaychar':showChar();return;
  case'addpj':P.push({id:uid(),title:'New project',cat:'Residential',year:String(new Date().getFullYear()),desc:'',images:[]});this.pi=P.length-1;return re();
  case'editpj':this.pi=this.pi===i?null:i;return this.tab('work');
  case'delpj':if(confirm('Delete project "'+P[i].title+'"?')){P.splice(i,1);this.pi=null;re()}return;
  case'up':if(i>0){[P[i-1],P[i]]=[P[i],P[i-1]];this.pi=null;re()}return;
  case'dn':if(i<P.length-1){[P[i+1],P[i]]=[P[i],P[i+1]];this.pi=null;re()}return;
  case'delimg':P[this.pi].images.splice(+b.dataset.k,1);return re();
  case'cover':{const im=P[this.pi].images.splice(+b.dataset.k,1)[0];P[this.pi].images.unshift(im);return re()}
  case'addurl':{const u=$('#pjUrl').value.trim();if(u){P[this.pi].images.push(u);re()}return}
  case'addstaff':{const n=$('#nsN').value.trim(),pw=$('#nsP').value;if(!n)return toast('Enter the employee name');if(pw.length<6)return toast('Password must be at least 6 characters');const s=rnd();CFG.staff.push({id:uid(),name:n,email:$('#nsE').value.trim(),salt:s,hash:await hashPw(pw,s)});toast('Employee registered');return re()}
  case'setpw':{const v=$('#sp'+i).value;if(v.length<6)return toast('Password must be at least 6 characters');const s=rnd();CFG.staff[i].salt=s;CFG.staff[i].hash=await hashPw(v,s);toast('Password updated');return re()}
  case'delstaff':if(confirm('Delete '+CFG.staff[i].name+'?')){CFG.staff.splice(i,1);re()}return;
  case'useloc':try{const c=await getLoc();CFG.office.lat=c.latitude.toFixed(6);CFG.office.lng=c.longitude.toFixed(6);CFG.office.on=true;re()}catch(x){toast(x.message)}return;
  case'csv':{const A=getAtt(),h=['ts','name','email','type','lat','lng','acc','inside','dist','map','method'];const csv=[h.join(','),...A.map(r=>h.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');dl('attendance.csv',csv,'text/csv');return}
  case'fromsheet':{const j=await sheetRead('attendance');if(j&&j.rows){localStorage.setItem(ATT,JSON.stringify(j.rows));toast('Loaded '+j.rows.length+' rows');this.tab('logs')}return}
  case'leadsheet':{const j=await sheetRead('leads');if(j&&j.rows){localStorage.setItem(LEADS,JSON.stringify(j.rows));toast('Loaded '+j.rows.length+' requests');this.tab('logs')}return}
  case'clrlog':if(confirm('Clear local attendance log? (Sheet data is not affected)')){localStorage.removeItem(ATT);this.tab('logs')}return;
  case'testsheet':{const ok=await postSheet({kind:'test',name:'Test from admin',ts:new Date().toISOString()});toast(ok?'Test sent — check your Sheet':'Add the Apps Script URL first');return}
  case'chpw':{const m=$('#pwMsg');m.style.color='#ff8a98';if(await hashPw($('#opw').value,CFG.admin.salt)!==CFG.admin.hash)return m.textContent='Current password is wrong.';const n=$('#npw').value;if(n.length<8)return m.textContent='New password must be at least 8 characters.';if(n!==$('#npw2').value)return m.textContent='Passwords do not match.';CFG.admin.salt=rnd();CFG.admin.hash=await hashPw(n,CFG.admin.salt);CFG.admin.def=false;save(true);m.style.color='#3dffa0';m.textContent='Password changed ✔';['opw','npw','npw2'].forEach(x=>$('#'+x).value='');return}
  case'export':{if(CFG.admin.def&&!confirm('You are still using the default admin password (admin123). Published, it lets anyone open your admin panel in their own browser. OK = export anyway, Cancel = go change it first.'))return;const js=JSON.stringify(clone(CFG));dl('config.json',js,'application/json');toast('Exported '+(js.length/1048576).toFixed(1)+' MB — upload config.json to GitHub');return}
  case'resetlocal':if(confirm('Discard edits made in this browser?')){localStorage.removeItem(LS);location.reload()}return;
  case'factory':if(confirm('Reset EVERYTHING (settings, staff, logs) in this browser?')){[LS,ATT,LEADS,Q].forEach(k=>localStorage.removeItem(k));location.reload()}return;
  }}
};
function touch(heavy){LIVE=true;applyAll();save(heavy)}
async function sheetRead(action){const I=CFG.integ;if(!I.sheetsUrl){toast('Add the Apps Script URL first');return null}let k=sessionStorage.getItem('lumiere_rk');if(!k){k=prompt('Enter your private READ_KEY (set in Code.gs):');if(!k)return null}try{const r=await fetch(I.sheetsUrl+'?action='+action+'&key='+encodeURIComponent(k),{cache:'no-store'});const j=await r.json();if(j.error){sessionStorage.removeItem('lumiere_rk');toast(j.error==='unauthorized'?'Wrong read key':'Sheet error: '+j.error);return null}sessionStorage.setItem('lumiere_rk',k);return j}catch(x){toast('Could not read the Sheet (is the Web App deployed for "Anyone"?)');return null}}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
/* integ tab post-render: google connect */
const _tab=ADM.tab.bind(ADM);ADM.tab=function(k){_tab(k);if(k==='integ'){const el=$('#admConnect');if(el)gBtn(el,p=>{CFG.integ.googleAccount=p.email;save(true);toast('Connected: '+p.email);ADM.tab('integ')})}};
document.addEventListener('change',async e=>{const el=e.target;if(!el.hasAttribute('data-imp')||!el.files.length)return;try{const j=JSON.parse(await readText(el.files[0]));if(!j||!j.colors)throw 0;CFG=clone(DEFAULT);merge(CFG,j);save(true);location.reload()}catch(x){toast('That is not a valid config.json')}});

/* ============ events ============ */
document.addEventListener('click',e=>{const t=e.target;
  if(t.closest('.eye')){const b=t.closest('.eye'),inp=b.parentElement.querySelector('input');const show=inp.type==='password';inp.type=show?'text':'password';b.innerHTML=show?EYEX:EYE;b.setAttribute('aria-label',show?'Hide password':'Show password');return}
  if(t.closest('[data-close]')){closeOv(t.closest('.ovl'));return}
  if(t.classList&&t.classList.contains('ovl')&&t.id!=='lb'){closeOv(t);return}
  if(t.closest('.js-staff')){$('#nav').classList.remove('open');openStaff();return}
  if(t.closest('.js-adminin')){$('#nav').classList.remove('open');$('#adMsg').textContent='';$('#adOv').classList.add('on');document.body.style.overflow='hidden';gBtn($('#adG'),p=>{if(CFG.integ.adminEmail&&(p.email||'').toLowerCase()===CFG.integ.adminEmail.toLowerCase())adminIn();else $('#adMsg').textContent='This Google account is not the admin account.'});setTimeout(()=>$('#adPw').focus(),100);return}
  if(t.closest('.js-adminout')){adminOut();return}
  if(t.closest('.js-dash')||t.closest('#fab')){openAdm();return}
  if(t.closest('#admHide')){$('#adm').classList.remove('on');admUI();return}
  const f=t.closest('[data-f]');if(f){FILTER=f.dataset.f;renderPortfolio();return}
  const pj=t.closest('[data-pj]');if(pj){openLB(pj.dataset.pj,0);return}
  const sv=t.closest('[data-svc]');if(sv){$('#cSvc').value=CFG.content.services[+sv.dataset.svc].title;location.hash='#contact';return}
  const th=t.closest('#lbTh [data-k]');if(th){LB.i=+th.dataset.k;drawLB();return}
  if(t.id==='lbImg'){t.classList.toggle('z');return}
  if(t.closest('#cbX')){$('#char').classList.remove('sp');e.stopPropagation();return}
  if(t.closest('#char')){location.hash='#contact';$('#char').classList.remove('sp');return}
  if(t.closest('#burger')){$('#nav').classList.toggle('open');return}
  if(t.closest('.links a'))$('#nav').classList.remove('open')});
$('#lbP').onclick=()=>lbGo(-1);$('#lbN').onclick=()=>lbGo(1);
$('#lb .main').addEventListener('click',e=>{if(e.target.classList.contains('main'))closeOv($('#lb'))});
let tx=0;$('#lb').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});$('#lb').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>60)lbGo(d>0?-1:1)});
addEventListener('keydown',e=>{if(e.key==='Escape')$$('.ovl.on').forEach(closeOv);const ae=document.activeElement;if((e.key==='Enter'||e.key===' ')&&ae&&ae.matches&&ae.matches('.pj,.svc')){e.preventDefault();ae.click()}if($('#lb').classList.contains('on')){if(e.key==='ArrowLeft')lbGo(-1);if(e.key==='ArrowRight')lbGo(1)}if(e.key==='Enter'){if($('#stOv').classList.contains('on')&&!$('#stLogin').classList.contains('hide'))staffPw();if($('#adOv').classList.contains('on'))admPw()}});
$('#stGo').onclick=staffPw;$('#adGo').onclick=admPw;$('#btnIn').onclick=()=>clock('in');$('#btnOut').onclick=()=>clock('out');$('#stOut').onclick=staffOut;
addEventListener('resize',rs);

/* ============ boot ============ */
(async function(){
  setTimeout(()=>{const l=$('#loader');if(l)l.classList.add('gone')},9000);
  try{await loadCfg();await ensureDefaults();applyAll();rs();bgFrame();admUI();observe();flushQ()}catch(err){console.error(err);$('#loader').classList.add('gone');document.body.dataset.rv='none';toast('Something went wrong while loading. Try a hard refresh (Ctrl+Shift+R).')}
  const L=$('#loader');
  if(!CFG.anim.loader){L.classList.add('gone');showChar();return}
  L.classList.add(CFG.anim.loaderStyle);
  const bar=$('#ldBar'),pct=$('#ldPct');let p=0;const iv=setInterval(()=>{p=Math.min(100,p+Math.random()*14+6);bar.style.width=p+'%';pct.textContent=Math.floor(p)+'%';if(p>=100){clearInterval(iv);setTimeout(()=>{L.classList.add('out');showChar();setTimeout(()=>L.classList.add('gone'),1000)},250)}},110);
})();
